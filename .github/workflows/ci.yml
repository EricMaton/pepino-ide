name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: ktlint + detekt
        run: ./gradlew ktlintCheck detekt --no-daemon --stacktrace

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build and test (Android)
        run: ./gradlew :app:assembleDebug testDebugUnitTest --no-daemon --stacktrace

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Build iOS framework (stub)
        run: ./gradlew :app:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace
