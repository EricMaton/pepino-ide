<!doctype html>
<html>
  <head>
    <style>
      main {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 24px 16px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
      }
      p {
        margin: 0;
        color: var(--outline);
      }
      button {
        align-self: flex-start;
        min-height: 48px;
        padding: 0 20px;
        border: 2px solid var(--fg);
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.1em;
        box-shadow: 4px 4px 0 var(--fg);
      }
      button:active {
        transform: translate(4px, 4px);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Hello</h1>
      <p>A plugin's own page: it talks only to its plugin, which keeps the count.</p>
      <button id="tap" type="button">TAP</button>
      <p id="count">…</p>
    </main>
    <script>
      pepino.onMessage(({ name, taps }) => {
        document.getElementById('title').textContent = `Hello, ${name}!`;
        document.getElementById('count').textContent = `${taps} ${taps === 1 ? 'tap' : 'taps'}, kept by the plugin`;
      });
      document.getElementById('tap').addEventListener('click', () => pepino.postMessage({ type: 'tap' }));
      pepino.postMessage({ type: 'ready' });
    </script>
  </body>
</html>
